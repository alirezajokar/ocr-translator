<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <title>OCR Translator</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="titlebar" id="titlebar">
      <div class="titlebar-brand">
        <svg class="titlebar-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="url(#brandGrad)" stroke-width="2.2" />
          <line x1="15.3" y1="15.3" x2="21" y2="21" stroke="url(#brandGrad)" stroke-width="2.2" stroke-linecap="round" />
          <defs>
            <linearGradient id="brandGrad" x1="4" y1="4" x2="21" y2="21" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#7c8cff" />
              <stop offset="1" stop-color="#a276ff" />
            </linearGradient>
          </defs>
        </svg>
        <span class="titlebar-label">OCR Translator</span>
      </div>
      <button id="closeBtn" class="titlebar-close" title="Close (Esc)" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <main id="content" class="content">
      <div id="statusView" class="view status-view">
        <div class="spinner-wrap" aria-hidden="true">
          <div class="spinner-glow"></div>
          <div class="spinner"></div>
        </div>
        <p id="statusMessage" class="status-message">Waiting for selection…</p>
      </div>

      <div id="cancelledView" class="view cancelled-view hidden">
        <svg class="state-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
          <path d="M8.5 8.5L15.5 15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <p class="cancelled-message" id="cancelledMessage">Selection cancelled.</p>
      </div>

      <div id="errorView" class="view error-view hidden">
        <svg class="state-icon state-icon-error" width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3.5L21.5 20H2.5L12 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          <line x1="12" y1="10" x2="12" y2="14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="12" cy="17.3" r="1.1" fill="currentColor" />
        </svg>
        <p class="error-message" id="errorMessage"></p>
        <button id="retryBtn" class="btn btn-secondary">Capture Again</button>
      </div>

      <div id="resultView" class="view result-view hidden">
        <section class="text-section">
          <div class="section-header">
            <h2>
              <svg class="section-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 3.5h9l4.5 4.5V20a1 1 0 01-1 1H6a1 1 0 01-1-1V4.5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                <path d="M8.5 12.5h7M8.5 16h7M8.5 9h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              Extracted text
            </h2>
            <button class="copy-btn" data-target="extractedText">Copy</button>
          </div>
          <pre id="extractedText" class="text-box"></pre>
        </section>

        <section class="text-section text-section-translation">
          <div class="section-header">
            <h2>
              <svg class="section-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" />
                <path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.3 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.3-3.6-8.5S9.6 5.8 12 3.5z" stroke="currentColor" stroke-width="1.5" />
              </svg>
              Translation
            </h2>
            <button class="copy-btn hidden" data-target="translatedText" id="copyTranslationBtn">Copy</button>
          </div>
          <button id="translateBtn" class="btn btn-primary">Translate</button>
          <pre id="translatedText" class="text-box hidden"></pre>
          <p id="translationError" class="error-message hidden"></p>
        </section>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
